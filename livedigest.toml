# Relative paths resolve against this file's directory.
# Platform cookies are secrets: put them in cookies.toml beside this file
# (git-ignored), e.g. douyin = "..."; bilibili, xiaohongshu and youtube likewise.
recordings_dir = "recordings"            # one folder per broadcast
output_dir = "digests"                   # transcripts, digests, index
rooms_path = "rooms.toml"                # see rooms.example.toml

[capture]
segment_seconds = 300                    # audio segment length; each is transcribed when it closes
frame_interval = 10                      # seconds between stills (keep = auto | video)
poll_seconds = 60                        # how often an offline room is checked
merge_gap_seconds = 600                  # a room back within this is the same broadcast
min_free_gb = 5.0                        # no new captures below this
quality = "low"                          # low = smaller stream (speech and stills only need that); best
# proxy = "http://127.0.0.1:7890"

[transcribe]
engine = "auto"                          # auto = qwen3 when mlx-audio is installed, else whisper
language = "zh"
qwen3_model = "mlx-community/Qwen3-ASR-1.7B-8bit"
whisper_model = "mlx-community/whisper-large-v3-turbo"

[polish]
enabled = true
command = ["claude", "-p"]

[digest]
enabled = true
command = ["claude", "-p"]               # prompt on stdin, Markdown on stdout
language = "简体中文"

[douyin]
opencli = ""                             # "" = $OPENCLI, PATH, then the newest ~/.nvm Node
